# HW8: measure round trips and one real call FROM WHERE THE CODE RUNS (a GitHub Actions runner).
# Actions tab > hw8-measure > Run workflow. Copy the log into the report.
name: hw8-measure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Where is this runner (city/region/provider only, no IP)
        run: curl -s https://ipinfo.io/json | python -c "import json,sys;d=json.load(sys.stdin);print(d.get('city'),d.get('region'),d.get('country'),d.get('org'))" || true
      - name: RTT probe
        run: python hw8/rtt_probe.py --file hw8/endpoints.txt --count 20 --csv rtt_runner.csv
      - name: Time 5 real verifier calls
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python hw8/time_call.py --n 5
      - uses: actions/upload-artifact@v4
        with:
          name: hw8-rtt
          path: rtt_runner.csv
