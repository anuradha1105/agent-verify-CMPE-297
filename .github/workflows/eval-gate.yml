# Runs the eval gate on every pull request. The model key lives in a repository secret
# (Settings > Secrets and variables > Actions > OPENAI_API_KEY or GEMINI_API_KEY). Never commit a key.
name: eval-gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check model key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          p=$(python -c "import json;print(json.load(open('manifest.json'))['provider'])")
          k=$( [ "$p" = gemini ] && echo "$GEMINI_API_KEY" || echo "$OPENAI_API_KEY" )
          [ -n "$k" ] || { echo "::error::no API key secret for provider $p (Settings > Secrets and variables > Actions)"; exit 1; }
      # standard library only: nothing to pip install
      - name: Eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MIN_INTERVAL: ${{ vars.LLM_MIN_INTERVAL || '4.5' }}
          AUDIT_LOG: audit_log.jsonl
        run: python eval_gate.py --gate | tee gate_output.txt; exit ${PIPESTATUS[0]}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            gate_report.json
            gate_output.txt
            audit_log.jsonl
      - name: Post the verdict on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Eval gate"; echo; echo '```'; cat gate_output.txt 2>/dev/null || echo "gate did not run"; echo '```';
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
