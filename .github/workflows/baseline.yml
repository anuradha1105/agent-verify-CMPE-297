# Manual: measure the noise floor (A/A) of the current release and upload baseline.json.
# Actions tab > baseline > Run workflow. Download the artifact, commit baseline.json.
name: baseline
on:
  workflow_dispatch:
    inputs:
      runs:
        description: A/A runs
        default: "6"
permissions:
  contents: write
jobs:
  aa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check model key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          p=$(python -c "import json;print(json.load(open('manifest.json'))['provider'])")
          k=$( [ "$p" = gemini ] && echo "$GEMINI_API_KEY" || echo "$OPENAI_API_KEY" )
          [ -n "$k" ] || { echo "::error::no API key secret for provider $p (Settings > Secrets and variables > Actions)"; exit 1; }
      - name: A/A runs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MIN_INTERVAL: ${{ vars.LLM_MIN_INTERVAL || '4.5' }}
          AUDIT_LOG: audit_log.jsonl
        run: python eval_gate.py --aa --aa-runs ${{ inputs.runs }} 2>&1 | tee baseline_output.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline
          path: |
            baseline.json
            baseline_output.txt
            audit_log.jsonl
      - name: Commit baseline.json (and the output, even on failure)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline_output.txt
          [ -f baseline.json ] && git add baseline.json
          [ -f audit_log.jsonl ] && cp audit_log.jsonl baseline_audit_log.jsonl && git add baseline_audit_log.jsonl
          git commit -m "baseline: A/A noise floor for $(python -c "import json;print(json.load(open('manifest.json'))['release'])") (run ${{ github.run_id }})"
          git push
